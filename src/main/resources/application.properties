spring.application.name=finance-analysis
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/financedb}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
# WARNING: use 'validate' in production with a migration tool (Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=1800s
# JWT_SECRET must be set as an environment variable (base64-encoded, min 32 bytes). No default — app fails to start if absent.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@finance-app.com}}

# Financial Modeling Prep
fmp.api.key=${FMP_API_KEY:demo}

# Scheduler
spring.task.scheduling.pool.size=2
